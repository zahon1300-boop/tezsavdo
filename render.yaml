services:
  - type: web
    name: tezsavdo
    env: python
    pythonVersion: 3.12.18
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class sync --timeout 120
