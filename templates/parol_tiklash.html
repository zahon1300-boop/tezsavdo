{% extends 'base.html' %}
{% load static %}

{% block title %}Parolni tiklash - TezSavdo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="auth-icon mb-3">
                            <i class="fas fa-lock-open"></i>
                        </div>
                        <h3 class="fw-bold">Parolni tiklash</h3>
                        <p class="text-muted mb-0">Elektron pochtangiz yoki telefon raqamingizni kiriting</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Elektron pochta yoki telefon</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input type="text" name="aloqa" class="form-control border-start-0" placeholder="example@mail.com yoki +998..." required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                            <i class="fas fa-paper-plane me-2"></i>Tiklash kodini yuborish
                        </button>
                    </form>
                    <div class="text-center">
                        <a href="{% url 'kirish' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Kirish sahifasiga qaytish
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
